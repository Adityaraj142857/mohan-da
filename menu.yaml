# Real menu for MohanDa's (Ramanujan Hostel, IIM Calcutta), transcribed from
# the shop's printed menu card (17/07/2026). The DB becomes the runtime
# source of truth after first load — edit prices/availability from
# /admin/menu once the app has started once; editing this file afterwards
# will NOT change already-seeded items (only newly added ones).
