[project]
name = "shopbot"
version = "0.1.0"
description = "Free, bank-verified UPI ordering bot for a small food shop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "qrcode[pil]>=7.4",
  "pillow>=10.3",
  "imagehash>=4.3",
  "python-dateutil>=2.9",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
shopbot = "shopbot.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "ocr: needs the real OCR engine (slow, optional)",
]

[tool.ruff]
line-length = 100
src = ["src"]
