{% extends "base.html" %}
{% block title %}Daily Summary — ShopBot{% endblock %}
{% block content %}
<style>
  .report-pre {
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }
</style>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
  <div>
    <h1 class="page-title" style="margin:0;">Daily Business Summary</h1>
    <p class="page-subtitle" style="margin-top:4px;">A complete overview of today's operations.</p>
  </div>
  <div style="display:flex; gap:10px;">
    <button type="button" class="secondary" onclick="navigator.clipboard.writeText(document.getElementById('report-text').textContent).then(() => alert('Copied to clipboard!'))">Copy Text</button>
    <a href="/admin/daily-summary/text" target="_blank"><button type="button">Raw Text</button></a>
  </div>
</div>

<div class="card">
  <pre id="report-text" class="report-pre">{{ summary.text_report }}</pre>
</div>
{% endblock %}
