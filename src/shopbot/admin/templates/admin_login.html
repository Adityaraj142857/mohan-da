<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner login</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f6f8; }
  form { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); width: 280px; }
  input { width: 100%; padding: 10px; margin: 8px 0 14px; border: 1px solid #ccc; border-radius: 6px; }
  button { width: 100%; padding: 10px; background: #1f6f43; color: white; border: none; border-radius: 6px; font-size: 15px; }
  .error { color: #b23b3b; font-size: 13px; }
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <h3>Owner Console</h3>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Password</label>
  <input type="password" name="password" autofocus required>
  <button type="submit">Log in</button>
</form>
</body>
</html>
